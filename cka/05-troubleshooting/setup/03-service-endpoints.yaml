apiVersion: v1
kind: Namespace
metadata:
  name: ts-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: ts-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: ts-svc
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
